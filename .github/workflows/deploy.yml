name: Deploy To GCP

on:
  workflow_run:
    workflows: [Pipeline]
    types: [completed]
    branches: [main]
  workflow_call:
    secrets:
      GCP_CREDENTIALS:
        required: false

jobs:
  deploy:
    name: Deploy To Cloud Run
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Auth Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Deploy To Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.APP_NAME }}
          image: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}:${{ github.event.workflow_run.head_sha || github.sha }}
          flags: --port=${{ vars.CONTAINER_PORT || '8080' }} --no-invoker-iam-check --service-account=${{ vars.APP_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - name: Verify
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors "$URL"